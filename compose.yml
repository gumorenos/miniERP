services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minierp
      POSTGRES_PASSWORD: minierp
      POSTGRES_DB: minierp
    ports:
      - "54329:5432"
    volumes:
      - minierp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minierp -d minierp"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://minierp:minierp@db:5432/minierp
      APP_USER_EMAIL: admin@example.test
      APP_USER_PASSWORD: change-me-dev
      APP_BUSINESS_NAME: Taller demo
    ports:
      - "3001:3000"
    command: sh -c "npm run db:migrate && npm run db:seed && npm start"

volumes:
  minierp_pg:
