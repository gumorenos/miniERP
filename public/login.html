<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8f2948" />
  <title>Samiiwara · Ingresar</title>
  <style>
    :root{color:#291f22;background:#f7f0e4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px}main{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f0e4}.panel{width:min(100%,440px);background:#fffdf8;border:1px solid #e5d7c6;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(57,35,39,.08)}.brand{margin:0 0 4px;color:#8f2948;font-size:.8rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;font-weight:600}.lead{color:#6f6163;margin:0 0 22px;line-height:1.5}form{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:750}input{width:100%;min-height:46px;border:1px solid #d9c8ba;border-radius:10px;padding:0 12px;font:inherit;background:white}button{min-height:46px;border:0;border-radius:10px;padding:0 16px;background:#8f2948;color:white;font:inherit;font-weight:850;cursor:pointer}.error{color:#a1262f;font-weight:750}.success{color:#48653c;font-weight:750}
  </style>
</head>
<body>
<main><section class="panel">
  <p class="brand">Samiiwara</p><h1>Gestión del taller</h1><p class="lead">Ingresa con tu cuenta para administrar pedidos, clientes, productos e inventario.</p>
  <p id="success" class="success" hidden></p>
  <form id="form">
    <label for="email">Correo<input id="email" name="email" type="email" autocomplete="username" required /></label>
    <label for="password">Contraseña<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
    <p id="error" class="error" hidden></p><button id="submit" type="submit">Entrar</button>
  </form>
</section></main>
<script>
  const params=new URLSearchParams(location.search);
  if(params.get("passwordChanged")==="1"){const s=document.getElementById("success");s.textContent="Contraseña actualizada. Ingresa nuevamente.";s.hidden=false}
  document.getElementById("form").addEventListener("submit",async(event)=>{
    event.preventDefault(); const button=document.getElementById("submit"); const error=document.getElementById("error"); error.hidden=true; button.disabled=true;
    const response=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})}).catch(()=>null);
    if(!response){button.disabled=false;error.textContent="No se pudo conectar.";error.hidden=false;return}
    const body=await response.json().catch(()=>({}));
    if(!response.ok){button.disabled=false;error.textContent=body.error||"No se pudo entrar.";error.hidden=false;return}
    const session=await fetch("/api/auth/session",{credentials:"same-origin"}).then(r=>r.json()).catch(()=>({}));
    location.replace(session.mustChangePassword?"/change-password.html":"/");
  });
</script>
</body>
</html>
