<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8f2948" />
    <title>Samiiwara · Cambiar contraseña</title>
    <style>
      :root { color:#291f22; background:#f7f0e4; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; min-width:320px; }
      main { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top right,#f3dfc2 0,transparent 34%),#f7f0e4; }
      .panel { width:min(100%,440px); background:#fffdf8; border:1px solid #e5d7c6; border-radius:18px; padding:28px; box-shadow:0 18px 50px rgba(57,35,39,.08); overflow:hidden; position:relative; }
      .panel::before { content:""; position:absolute; inset:0 0 auto 0; height:6px; background:linear-gradient(90deg,#9f2f4d 0 28%,#d99a2b 28% 52%,#287d78 52% 76%,#5b7b4b 76%); }
      .brand { margin:0 0 4px; color:#8f2948; font-size:.8rem; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
      h1 { margin:0 0 10px; font-family:Georgia,"Times New Roman",serif; font-size:1.9rem; font-weight:600; }
      .lead { color:#6f6163; margin:0 0 22px; line-height:1.5; }
      form { display:grid; gap:14px; }
      label { display:grid; gap:6px; font-weight:750; }
      input { width:100%; min-height:46px; border:1px solid #d9c8ba; border-radius:10px; padding:0 12px; font:inherit; background:white; }
      input:focus { outline:3px solid rgba(159,47,77,.15); border-color:#9f2f4d; }
      button { min-height:46px; border:0; border-radius:10px; padding:0 16px; background:#8f2948; color:white; font:inherit; font-weight:850; cursor:pointer; }
      button:disabled { opacity:.55; }
      .hint { color:#7b6d6f; font-size:.84rem; margin:0; }
      .error { color:#a1262f; font-weight:750; margin:0; }
      .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <p class="brand">Samiiwara</p>
        <h1>Crea tu contraseña</h1>
        <p class="lead">La contraseña con la que ingresaste es temporal. Cámbiala antes de usar el taller.</p>
        <form id="form">
          <label class="sr-only" for="username">Correo<input id="username" name="username" type="email" autocomplete="username" tabindex="-1" /></label>
          <label for="password">Nueva contraseña</label>
          <input id="password" name="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required />
          <label for="confirm">Repite la contraseña</label>
          <input id="confirm" name="confirm-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required />
          <p class="hint">Usa al menos 12 caracteres. Una frase corta y única suele ser más fácil de recordar.</p>
          <p id="error" class="error" hidden></p>
          <button id="submit" type="submit">Guardar y volver a entrar</button>
        </form>
      </section>
    </main>
    <script>
      const authHeaders = () => ({ "content-type":"application/json" });
      const fail = (message) => { const el = document.getElementById("error"); el.textContent = message; el.hidden = false; };

      async function init() {
        const response = await fetch("/api/auth/session", { credentials:"same-origin", headers: authHeaders() });
        if (!response.ok) return location.replace("/login.html");
        const session = await response.json();
        document.getElementById("username").value = session.user?.email || "";
        if (!session.mustChangePassword) location.replace("/");
      }

      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        const button = document.getElementById("submit");
        document.getElementById("error").hidden = true;
        if (password.length < 12) return fail("La contraseña debe tener al menos 12 caracteres.");
        if (password !== confirm) return fail("Las contraseñas no coinciden.");
        button.disabled = true;
        const response = await fetch("/api/auth/change-password", { method:"POST", credentials:"same-origin", headers:authHeaders(), body:JSON.stringify({ newPassword: password }) });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          button.disabled = false;
          return fail(payload.error || "No se pudo cambiar la contraseña.");
        }
        location.replace("/login.html?passwordChanged=1");
      });

      init().catch(() => { location.replace("/login.html"); });
    </script>
  </body>
</html>
