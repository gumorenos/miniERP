<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8f2948" />
  <title>Samiiwara · Mi cuenta</title>
  <style>
    :root{color:#291f22;background:#f7f0e4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px}main{min-height:100vh;padding:24px;background:#f7f0e4}.panel{width:min(100%,620px);margin:0 auto;background:#fffdf8;border:1px solid #e5d7c6;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(57,35,39,.08)}.brand{margin:0 0 4px;color:#8f2948;font-size:.8rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;font-weight:600}.lead,.hint{color:#6f6163;line-height:1.5}.lead{margin:0 0 22px}.hint{font-size:.84rem;margin:0}form{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:750}input{width:100%;min-height:46px;border:1px solid #d9c8ba;border-radius:10px;padding:0 12px;font:inherit;background:white}input:focus{outline:3px solid rgba(159,47,77,.15);border-color:#9f2f4d}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.button{min-height:44px;border:0;border-radius:10px;padding:0 16px;background:#8f2948;color:white;font:inherit;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#eee3d6!important;color:#291f22!important}.error{color:#a1262f;font-weight:750}.success{color:#48653c;font-weight:750}@media(max-width:520px){main{padding:14px}.panel{padding:20px}.actions>*{width:100%}}
  </style>
</head>
<body>
<main><section class="panel">
  <p class="brand">Samiiwara</p><h1>Mi cuenta</h1>
  <p class="lead">Actualiza tu nombre y correo de acceso. La contraseña actual solo se pide si cambias el correo.</p>
  <form id="form">
    <label for="name">Nombre<input id="name" name="name" autocomplete="name" minlength="2" required /></label>
    <label for="email">Correo<input id="email" name="email" type="email" autocomplete="username" required /></label>
    <label for="password">Contraseña actual <span class="hint">solo si cambias el correo</span><input id="password" name="current-password" type="password" autocomplete="current-password" /></label>
    <p id="message" hidden></p>
    <div class="actions"><button id="save" type="submit">Guardar cambios</button><a class="button secondary" href="/">Volver al taller</a></div>
  </form>
</section></main>
<script>
  const tokenKey="minierp.token"; const token=localStorage.getItem(tokenKey);
  const headers=()=>({"content-type":"application/json",authorization:`Bearer ${token}`});
  const message=document.getElementById("message");
  const show=(text,ok)=>{message.textContent=text;message.className=ok?"success":"error";message.hidden=false};
  async function init(){
    if(!token)return location.replace("/login.html");
    const response=await fetch("/api/account",{headers:headers()});
    if(response.status===401){localStorage.removeItem(tokenKey);return location.replace("/login.html")}
    if(!response.ok)return show("No se pudo cargar la cuenta.",false);
    const account=await response.json(); document.getElementById("name").value=account.name; document.getElementById("email").value=account.email;
  }
  document.getElementById("form").addEventListener("submit",async(event)=>{
    event.preventDefault(); message.hidden=true; const button=document.getElementById("save"); button.disabled=true;
    const payload={name:document.getElementById("name").value,email:document.getElementById("email").value,currentPassword:document.getElementById("password").value||undefined};
    const response=await fetch("/api/account",{method:"PATCH",headers:headers(),body:JSON.stringify(payload)});
    const body=await response.json().catch(()=>({})); button.disabled=false;
    if(response.status===401){localStorage.removeItem(tokenKey);return location.replace("/login.html")}
    if(!response.ok)return show(body.error||"No se pudo guardar.",false);
    document.getElementById("password").value=""; show("Cuenta actualizada correctamente.",true);
  });
  init().catch(()=>show("No se pudo cargar la cuenta.",false));
</script>
</body>
</html>
