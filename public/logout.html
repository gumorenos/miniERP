<!doctype html>
<html lang="es">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Samiiwara · Salir</title></head>
<body>
  <p>Saliendo...</p>
  <script>
    (async () => {
      const key = "minierp.token";
      const token = localStorage.getItem(key);
      if (token) {
        await fetch("/api/auth/logout", {
          method: "POST",
          headers: { "content-type": "application/json", authorization: `Bearer ${token}` },
          body: JSON.stringify({})
        }).catch(() => undefined);
      }
      localStorage.removeItem(key);
      location.replace("/login.html");
    })();
  </script>
</body>
</html>
